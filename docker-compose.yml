services:
  host-actions-init:
    image: alpine:3.20
    command:
      - sh
      - -c
      - >-
        mkdir -p /host-actions/pending /host-actions/processed /host-actions/failed &&
        chmod -R a+rwX /host-actions
    volumes:
      - ./runtime/host-actions:/host-actions
    restart: "no"

  app:
    build: .
    env_file: .env
    environment:
      DEVPILOT_DATABASE_URL: postgresql+psycopg://devpilot:devpilot@postgres:5432/devpilot
      DEVPILOT_DATA_DIR: /data
      DEVPILOT_REPOSITORIES_DIR: /data/repositories
      DEVPILOT_HOST_ACTIONS_DIR: /runtime/host-actions
      DEVPILOT_LINUX_AGENT_SOCKET: /runtime/linux-agent/agent.sock
      DEVPILOT_REDIS_URL: ${DEVPILOT_REDIS_URL:-redis://redis:6379/0}
      DEVPILOT_RATE_LIMIT_ENABLED: ${DEVPILOT_RATE_LIMIT_ENABLED:-true}
      DEVPILOT_RATE_LIMIT_REQUESTS: ${DEVPILOT_RATE_LIMIT_REQUESTS:-120}
      DEVPILOT_AUTH_RATE_LIMIT_REQUESTS: ${DEVPILOT_AUTH_RATE_LIMIT_REQUESTS:-10}
      DEVPILOT_RATE_LIMIT_WINDOW_SECONDS: ${DEVPILOT_RATE_LIMIT_WINDOW_SECONDS:-60}
      DEVPILOT_CACHE_ENABLED: ${DEVPILOT_CACHE_ENABLED:-true}
      DEVPILOT_CACHE_TTL_SECONDS: ${DEVPILOT_CACHE_TTL_SECONDS:-30}
      DEVPILOT_CACHE_MAX_BODY_BYTES: ${DEVPILOT_CACHE_MAX_BODY_BYTES:-1048576}
      DEVPILOT_TRUST_PROXY_HEADERS: ${DEVPILOT_TRUST_PROXY_HEADERS:-false}
    ports:
      - "8080:8080"
    volumes:
      - devpilot_data:/data
      - ./runtime/host-actions:/runtime/host-actions
      - ${HOME}/.local/share/devpilot-linux-agent/runtime:/runtime/linux-agent
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      host-actions-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          response=urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2);
          raise SystemExit(0 if response.status == 200 else 1)
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      DEVPILOT_DATABASE_URL: postgresql+psycopg://devpilot:devpilot@postgres:5432/devpilot
      DEVPILOT_DATA_DIR: /data
      DEVPILOT_REPOSITORIES_DIR: /data/repositories
      DEVPILOT_HOST_ACTIONS_DIR: /runtime/host-actions
    volumes:
      - devpilot_data:/data
      - ./runtime/host-actions:/runtime/host-actions
    depends_on:
      postgres:
        condition: service_healthy
      host-actions-init:
        condition: service_completed_successfully
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: devpilot
      POSTGRES_USER: devpilot
      POSTGRES_PASSWORD: devpilot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devpilot -d devpilot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  devpilot_data:
  postgres_data:
