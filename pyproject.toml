[project]
name = "devpilot"
dynamic = ["version"]
description = "DevPilot — desenvolvimento automatizado, auditável e orientado por voz"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic-settings>=2.10,<3",
  "cryptography>=45,<46",
  "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1",
]

[project.scripts]
devpilot = "app.cli:main"

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
rag = ["redis>=6,<7"]
test = ["pytest>=8.4,<9", "pytest-cov>=6.2,<7"]
e2e = ["playwright>=1.48,<2"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "app.version.__version__"}

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "browser_e2e: browser-level end-to-end tests that require Playwright/Chromium",
]

[tool.ruff]
line-length = 100
target-version = "py312"
