services:
  rag-postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: devpilot_rag
      POSTGRES_USER: devpilot
      POSTGRES_PASSWORD: devpilot
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - devpilot_rag_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devpilot -d devpilot_rag"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  rag-redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no", "--save", "", "--maxmemory", "96mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20
    restart: unless-stopped

volumes:
  devpilot_rag_postgres_data:
