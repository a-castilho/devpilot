<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#020b08">
  <title>A Castilho — Logo Animada</title>
  <style>
    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:#020b08;
    }
    .replay{
      position:fixed;
      right:16px;
      bottom:16px;
      z-index:999999;
      border:1px solid rgba(102,255,180,.35);
      border-radius:999px;
      padding:10px 15px;
      background:rgba(0,0,0,.55);
      color:#8affbd;
      font:600 13px system-ui,sans-serif;
    }
  </style>
</head>
<body>

<button class="replay" onclick="location.reload()">↻ Repetir</button>

<script src="/assets/acs-loader.js"></script>

<script>
  // Repete automaticamente a animação.
  setTimeout(() => location.reload(), 3200);
</script>

</body>
</html>
