<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#030914">
  <title>DevPilot — Modo Jogo</title>
  <link rel="stylesheet" href="/assets/styles.css?v=game-v53-start-restored-20260901">
  <link rel="stylesheet" href="/assets/game-shell.css?v=game-v53-start-restored-20260901">
  <link rel="stylesheet" href="/assets/game/neon-layout.css?v=game-v53-start-restored-20260901">
  <style>
    body[data-devpilot-game-standalone="1"] .devpilot-game-hud,
    body[data-devpilot-game-standalone="1"] .game-neon-bottom-nav{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
    @media(min-width:901px){
      body[data-devpilot-game-standalone="1"] .game-neon-bottom-nav{display:none!important}
      body[data-devpilot-game-standalone="1"] .devpilot-game-stage{padding-bottom:20px!important}
    }
  </style>
</head>
<body data-devpilot-game-standalone="1">
  <header class="devpilot-game-hud">
    <button id="game-exit" class="devpilot-game-exit" type="button" aria-label="Sair do modo jogo">‹</button>
    <div class="devpilot-game-hud-copy">
      <span>MISSÃO ATIVA</span>
      <strong>Modo Jogo isolado</strong>
    </div>
  </header>

  <main class="devpilot-game-stage">
    <section class="view active devpilot-game-view-mounted" id="build-game-view" aria-live="polite"></section>
  </main>

  <div class="toast" id="toast"></div>
  <dialog id="auth-modal">
    <form method="dialog" class="modal">
      <span class="eyebrow">ACESSO</span>
      <h2>Conectar ao DevPilot</h2>
      <p>Volte ao painel para autenticar antes de abrir o jogo.</p>
      <button class="primary" id="game-auth-back" value="default">Voltar ao painel</button>
    </form>
  </dialog>

  <script src="/assets/game/runtime.js?v=game-v53-start-restored-20260901"></script>
  <script src="/assets/build-game.js?v=game-v53-start-restored-20260901"></script>
  <script src="/assets/game/start-round-mobile.js?v=game-v53-start-restored-20260901"></script>
  <script src="/assets/game/delivery-gate.js?v=game-v53-start-restored-20260901"></script>
  <script src="/assets/build-game-url-bonus.js?v=game-v53-start-restored-20260901"></script>
  <script src="/assets/game/final-delivery-summary.js?v=game-v53-start-restored-20260901"></script>
  <script src="/assets/game/task-payload-guard.js?v=game-v53-start-restored-20260901"></script>
  <script src="/assets/game/inline-approval.js?v=game-v53-start-restored-20260901"></script>
  <script src="/assets/game/neon-layout.js?v=game-v53-start-restored-20260901"></script>
  <script src="/assets/game/project-switcher.js?v=game-v53-start-restored-20260901"></script>
  <script src="/assets/game/game-bootstrap.js?v=game-v53-start-restored-20260901"></script>
</body>
</html>
