<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <title>DevPilot — Modo Jogo</title>
  <link rel="stylesheet" href="/assets/styles.css?v=release-1.2.0-game-simple-v56-20260902">
  <link rel="stylesheet" href="/assets/game-shell.css?v=release-1.2.0-game-simple-v56-20260902">
</head>
<body data-devpilot-game-standalone="1">
  <header class="devpilot-game-hud">
    <button id="game-exit" class="devpilot-game-exit" type="button" aria-label="Sair do modo jogo">‹</button>
    <div class="devpilot-game-hud-copy">
      <span>MISSÃO ATIVA</span>
      <strong>Modo Jogo isolado</strong>
    </div>
    <button id="game-menu-toggle" class="devpilot-game-menu-toggle" type="button"
      aria-label="Abrir menu do DevPilot" aria-controls="game-menu" aria-expanded="false">☰</button>
    <nav id="game-menu" class="devpilot-game-menu" aria-label="Menu principal" hidden>
      <strong>DevPilot</strong>
      <button type="button" data-game-dashboard-view="overview">Visão geral</button>
      <button type="button" data-game-dashboard-view="organizations">Organizações</button>
      <button type="button" data-game-dashboard-view="projects">Projetos</button>
      <button type="button" data-game-dashboard-view="tasks">Execuções</button>
      <button type="button" data-game-dashboard-view="providers">Modelos de IA</button>
      <button type="button" data-game-dashboard-view="reports">Relatórios</button>
      <button type="button" data-game-dashboard-view="audit">Auditoria</button>
      <button type="button" class="active" aria-current="page">Modo Jogo</button>
    </nav>
  </header>

  <main class="devpilot-game-stage">
    <section class="view active devpilot-game-view-mounted" id="build-game-view" aria-live="polite">
      <div class="empty" data-game-boot-state="loading" role="status">
        <strong>Preparando Modo Jogo…</strong>
        <p>Carregando projeto e histórico leve da missão.</p>
      </div>
    </section>
  </main>

  <div class="toast" id="toast"></div>
  <dialog id="auth-modal">
    <form method="dialog" class="modal">
      <span class="eyebrow">ACESSO</span>
      <h2>Conectar ao DevPilot</h2>
      <p>Volte ao painel para autenticar antes de abrir o jogo.</p>
      <button class="primary" id="game-auth-back" value="default">Voltar ao painel</button>
    </form>
  </dialog>

  <script src="/assets/game/runtime.js?v=release-1.2.0-game-simple-v56-20260902"></script>
  <script src="/assets/build-game.js?v=release-1.2.0-game-simple-v56-20260902"></script>
  <script src="/assets/game/game-bootstrap.js?v=release-1.2.0-game-simple-v56-20260902"></script>
</body>
</html>
