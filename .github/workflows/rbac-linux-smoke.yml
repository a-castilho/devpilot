name: RBAC Linux Smoke

on:
  pull_request:
    paths:
      - "app/user_routes.py"
      - "app/schemas.py"
      - "app/static/users.js"
      - "tests/test_user_profiles.py"
      - "tests/test_user_security_frontend_contract.py"
      - ".github/workflows/rbac-linux-smoke.yml"

permissions:
  contents: read

jobs:
  rbac-security:
    name: RBAC security on Linux
    runs-on: ${{ vars.DEVPILOT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python3 -m pip install -e '.[test]'
      - name: Validate users JavaScript syntax
        run: node --check app/static/users.js
      - name: Run focused RBAC security tests
        run: python3 -m pytest -q tests/test_user_profiles.py tests/test_user_security_frontend_contract.py
