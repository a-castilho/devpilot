name: Publicar relatório seguro

on:
  workflow_run:
    workflows: ["Documentar issues", "Documentar revisões de PR"]
    types: [completed]
  push:
    branches: [main]
    paths: ["docs/**", "tools/build_project_report.py"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: project-report-main
  cancel-in-progress: true
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python tools/build_project_report.py --project DevPilot --output app/static/project-report.json
      - run: |
          if git diff --quiet -- app/static/project-report.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/static/project-report.json
          git commit -m "docs(report): atualiza projeção segura"
          git push
