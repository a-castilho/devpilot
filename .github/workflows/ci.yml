name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Use repository variable DEVPILOT_RUNNER=devpilot-ci (or self-hosted)
# to bypass GitHub-hosted minute exhaustion without weakening any gate.
jobs:
  changes:
    name: Detect change scope
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      frontend_only: ${{ steps.scope.outputs.frontend_only }}
      changed_files: ${{ steps.scope.outputs.changed_files }}
    steps:
      - name: Checkout diff range
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "frontend_only=false" >> "$GITHUB_OUTPUT"
            echo "changed_files=manual" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="$(git merge-base "origin/${{ github.base_ref }}" HEAD)"
          else
            BEFORE="${{ github.event.before }}"
            if [[ -n "$BEFORE" && "$BEFORE" != "0000000000000000000000000000000000000000" ]]; then
              BASE="$BEFORE"
            else
              BASE="$(git rev-parse HEAD^)"
            fi
          fi

          mapfile -t FILES < <(git diff --name-only "$BASE" HEAD)
          printf '%s\n' "${FILES[@]}"
          printf 'changed_files=%s\n' "${#FILES[@]}" >> "$GITHUB_OUTPUT"

          FRONTEND_ONLY=true
          if [[ ${#FILES[@]} -eq 0 ]]; then
            FRONTEND_ONLY=false
          fi
          for path in "${FILES[@]}"; do
            case "$path" in
              app/static/*|tests/test_*ui*.py|tests/test_*frontend*.py|tests/test_game_*contract.py)
                ;;
              *)
                FRONTEND_ONLY=false
                break
                ;;
            esac
          done
          echo "frontend_only=$FRONTEND_ONLY" >> "$GITHUB_OUTPUT"
          echo "Frontend-only: $FRONTEND_ONLY"

  policy:
    name: DevPilot policy
    runs-on: ${{ vars.DEVPILOT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Checkout full history for policy diff
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve current policy base
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="$(git merge-base "origin/${{ github.base_ref }}" HEAD)"
          else
            BEFORE="${{ github.event.before }}"
            if [[ -n "$BEFORE" && "$BEFORE" != "0000000000000000000000000000000000000000" ]]; then
              BASE="$BEFORE"
            else
              BASE="$(git rev-parse HEAD^)"
            fi
          fi
          echo "DEVPILOT_POLICY_BASE=$BASE" >> "$GITHUB_ENV"
          echo "Policy base: $BASE"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Python runtime
        run: |
          python3 - <<'PY'
          import sys
          if sys.version_info < (3, 12):
              raise SystemExit(f"DevPilot requer Python 3.12+, encontrado {sys.version.split()[0]}")
          print(sys.executable, sys.version.split()[0])
          PY

      - name: Enforce engineering standard
        run: python scripts/check-engineering-standards.py --changed

  quality:
    name: DevPilot quality
    needs: [policy, changes]
    runs-on: ${{ vars.DEVPILOT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 35
    env:
      DEVPILOT_RUN_BROWSER_E2E: ${{ needs.changes.outputs.frontend_only == 'true' && '0' || '1' }}
      DEVPILOT_RUN_CRITICAL_MATRIX: ${{ needs.changes.outputs.frontend_only == 'true' && '0' || '1' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve current policy base
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="$(git merge-base "origin/${{ github.base_ref }}" HEAD)"
          else
            BEFORE="${{ github.event.before }}"
            if [[ -n "$BEFORE" && "$BEFORE" != "0000000000000000000000000000000000000000" ]]; then
              BASE="$BEFORE"
            else
              BASE="$(git rev-parse HEAD^)"
            fi
          fi
          echo "DEVPILOT_POLICY_BASE=$BASE" >> "$GITHUB_ENV"

      - name: Fast frontend validation
        if: needs.changes.outputs.frontend_only == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "Frontend-only change: skipping dependency install, browser E2E, critical matrix and Docker image."
          mapfile -t JS_FILES < <(git diff --name-only "$DEVPILOT_POLICY_BASE" HEAD -- 'app/static/**/*.js' 'app/static/*.js')
          for file in "${JS_FILES[@]}"; do
            [[ -f "$file" ]] || continue
            echo "node --check $file"
            node --check "$file"
          done
          python3 -m compileall -q tests
          echo "FAST_FRONTEND_VALIDATION_OK"

      - name: Set up Python 3.12
        if: needs.changes.outputs.frontend_only != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify Python runtime
        if: needs.changes.outputs.frontend_only != 'true'
        run: |
          python3 - <<'PY'
          import sys
          if sys.version_info < (3, 12):
              raise SystemExit(f"DevPilot requer Python 3.12+, encontrado {sys.version.split()[0]}")
          print(sys.executable, sys.version.split()[0])
          PY

      - name: Install package, test and browser dependencies
        if: needs.changes.outputs.frontend_only != 'true'
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e '.[test,e2e]'

      - name: Install Chromium on GitHub-hosted runner
        if: needs.changes.outputs.frontend_only != 'true' && !vars.DEVPILOT_RUNNER
        run: python3 -m playwright install --with-deps chromium

      - name: Install Chromium on self-hosted runner
        if: needs.changes.outputs.frontend_only != 'true' && vars.DEVPILOT_RUNNER
        run: python3 -m playwright install chromium

      - name: Run complete validation including critical matrix and browser E2E
        if: needs.changes.outputs.frontend_only != 'true'
        run: |
          export PYTHON_BIN="$(command -v python3)"
          bash scripts/test-all.sh

      - name: Publish complete failure report
        if: always() && needs.changes.outputs.frontend_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: devpilot-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/test-results
          if-no-files-found: warn
          retention-days: 14

  runtime-image:
    name: DevPilot runtime image
    if: github.event_name != 'pull_request' && needs.changes.outputs.frontend_only != 'true'
    needs: [quality, changes]
    runs-on: ${{ vars.DEVPILOT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          if [[ -n "${{ vars.DEVPILOT_RUNNER }}" ]]; then
            docker build --network=host -t devpilot:ci .
          else
            docker build -t devpilot:ci .
          fi

      - name: Verify worker runtime tools
        run: |
          docker run --rm --entrypoint git devpilot:ci --version
          docker run --rm --entrypoint codex devpilot:ci --version
