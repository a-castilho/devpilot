name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: DevPilot tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]'

      - name: Compile Python sources
        run: python -m compileall -q app

      - name: Check dashboard JavaScript syntax
        run: |
          node --check app/static/app.js
          node --check app/static/execution-recovery.js

      - name: Run tests
        run: pytest

      - name: Build Docker image
        run: docker build -t devpilot:ci .
