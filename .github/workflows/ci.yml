name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Pull requests run on GitHub-hosted runners so merge gates stay available even
# when the local DevPilot runner is offline. Push/main can still use
# DEVPILOT_RUNNER to save hosted minutes without weakening the PR gate.
# This keeps PR validation independent from the developer workstation lifecycle.
jobs:
  policy:
    name: DevPilot policy
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || vars.DEVPILOT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Checkout full history for policy diff
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve current policy base
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="$(git merge-base "origin/${{ github.base_ref }}" HEAD)"
          else
            BEFORE="${{ github.event.before }}"
            if [[ -n "$BEFORE" && "$BEFORE" != "0000000000000000000000000000000000000000" ]]; then
              BASE="$BEFORE"
            else
              BASE="$(git rev-parse HEAD^)"
            fi
          fi
          echo "DEVPILOT_POLICY_BASE=$BASE" >> "$GITHUB_ENV"
          echo "Policy base: $BASE"

      - name: Set up Python on GitHub-hosted runner
        if: ${{ github.event_name == 'pull_request' || !vars.DEVPILOT_RUNNER }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Python on self-hosted runner
        if: ${{ github.event_name != 'pull_request' && vars.DEVPILOT_RUNNER }}
        run: |
          python3 - <<'PY'
          import sys
          if sys.version_info < (3, 12):
              raise SystemExit(f"DevPilot requer Python 3.12+, encontrado {sys.version.split()[0]}")
          print(sys.executable, sys.version.split()[0])
          PY

      - name: Enforce engineering standard
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" || -z "${{ vars.DEVPILOT_RUNNER }}" ]]; then
            python scripts/check-engineering-standards.py --changed
          else
            python3 scripts/check-engineering-standards.py --changed
          fi

  quality:
    name: DevPilot full quality
    needs: policy
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || vars.DEVPILOT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 35
    env:
      DEVPILOT_RUN_BROWSER_E2E: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve current policy base
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="$(git merge-base "origin/${{ github.base_ref }}" HEAD)"
          else
            BEFORE="${{ github.event.before }}"
            if [[ -n "$BEFORE" && "$BEFORE" != "0000000000000000000000000000000000000000" ]]; then
              BASE="$BEFORE"
            else
              BASE="$(git rev-parse HEAD^)"
            fi
          fi
          echo "DEVPILOT_POLICY_BASE=$BASE" >> "$GITHUB_ENV"

      - name: Set up Python on GitHub-hosted runner
        if: ${{ github.event_name == 'pull_request' || !vars.DEVPILOT_RUNNER }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify Python on self-hosted runner
        if: ${{ github.event_name != 'pull_request' && vars.DEVPILOT_RUNNER }}
        run: |
          python3 - <<'PY'
          import sys
          if sys.version_info < (3, 12):
              raise SystemExit(f"DevPilot requer Python 3.12+, encontrado {sys.version.split()[0]}")
          print(sys.executable, sys.version.split()[0])
          PY

      - name: Install package, test and browser dependencies
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" || -z "${{ vars.DEVPILOT_RUNNER }}" ]]; then PYTHON=python; else PYTHON=python3; fi
          "$PYTHON" -m pip install --upgrade pip
          "$PYTHON" -m pip install -e '.[test,e2e]'

      - name: Install Chromium on GitHub-hosted runner
        if: ${{ github.event_name == 'pull_request' || !vars.DEVPILOT_RUNNER }}
        run: python -m playwright install --with-deps chromium

      - name: Install Chromium on self-hosted runner
        if: ${{ github.event_name != 'pull_request' && vars.DEVPILOT_RUNNER }}
        run: python3 -m playwright install chromium

      - name: Run complete validation including browser game E2E
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" && -n "${{ vars.DEVPILOT_RUNNER }}" ]]; then export PYTHON_BIN="$(command -v python3)"; fi
          bash scripts/test-all.sh

      - name: Publish complete failure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devpilot-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/test-results
          if-no-files-found: warn
          retention-days: 14

  runtime-image:
    name: DevPilot runtime image
    if: github.event_name != 'pull_request'
    needs: quality
    runs-on: ${{ vars.DEVPILOT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t devpilot:ci .

      - name: Verify worker runtime tools
        run: |
          docker run --rm --entrypoint git devpilot:ci --version
          docker run --rm --entrypoint codex devpilot:ci --version
