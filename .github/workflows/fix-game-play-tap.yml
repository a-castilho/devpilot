name: Fix game play tap

on:
  push:
    branches:
      - fix/mobile-standard-top-back
    paths:
      - .github/workflows/fix-game-play-tap.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-standard-top-back
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/patch_game_play_tap.py
      - name: Validate JavaScript
        run: node --check app/static/game/objective-controls.js
      - name: Commit fix
        run: |
          git rm .github/workflows/fix-game-play-tap.yml scripts/patch_game_play_tap.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/static/game/objective-controls.js
          git commit -m "fix(game): garantir toque em Jogar agora no Android"
          git push origin HEAD:fix/mobile-standard-top-back
