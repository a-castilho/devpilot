name: Deploy Homolog (manual)

# The DevPilot application itself is not auto-deployed to homologation.
# Projects created/provisioned by DevPilot use their own cloud delivery flow
# and are intentionally unaffected by this workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ${{ vars.DEVPILOT_RUNNER || 'ubuntu-latest' }}
    environment:
      name: homologation
    steps:
      - name: Resolve tested commit
        id: commit
        shell: bash
        run: |
          echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Resolve Render homolog target
        id: render
        env:
          CONFIGURED_BASE_URL: ${{ vars.RENDER_HOMOLOG_BASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="${CONFIGURED_BASE_URL:-https://devpilot-homolog.onrender.com}"
          BASE_URL="${BASE_URL%/}"
          case "$BASE_URL" in
            https://*) ;;
            *)
              echo "::error::RENDER_HOMOLOG_BASE_URL must be an https URL."
              exit 1
              ;;
          esac
          echo "base_url=${BASE_URL}" >> "$GITHUB_OUTPUT"
          echo "Render homolog target: ${BASE_URL}"

      - name: Trigger Render deploy when hook is configured
        env:
          HOOK: ${{ secrets.RENDER_HOMOLOG_DEPLOY_HOOK }}
          SHA: ${{ steps.commit.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$HOOK" ]; then
            echo "::notice::RENDER_HOMOLOG_DEPLOY_HOOK not configured; expecting the linked Render service/Blueprint to auto-deploy after a manual request."
            exit 0
          fi
          SEP='?'; [[ "$HOOK" == *'?'* ]] && SEP='&'
          curl --fail --show-error --silent --request POST "${HOOK}${SEP}ref=${SHA}"

      - name: Verify Render service is provisioned
        env:
          BASE_URL: ${{ steps.render.outputs.base_url }}
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -L -sS -o /tmp/devpilot-render-preflight.txt -w '%{http_code}' --max-time 20 "${BASE_URL}/health" || true)
          if [ "$code" = "404" ]; then
            echo "::error::Render homolog target returned HTTP 404. The devpilot-homolog service/Blueprint is not provisioned at this URL, or its onrender.com subdomain is disabled. Connect render.yaml in Render (New > Blueprint) or configure RENDER_HOMOLOG_BASE_URL for the actual service URL before retrying."
            cat /tmp/devpilot-render-preflight.txt 2>/dev/null || true
            exit 1
          fi
          echo "Render preflight HTTP ${code}; endpoint exists or is still starting."

      - name: Wait for homologation health
        env:
          BASE_URL: ${{ steps.render.outputs.base_url }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Waiting for ${BASE_URL}/health"
          for attempt in $(seq 1 60); do
            code=$(curl -L -sS -o /tmp/devpilot-health.json -w '%{http_code}' --max-time 20 "${BASE_URL}/health" || true)
            if [ "$code" = "200" ] && grep -qi 'devpilot' /tmp/devpilot-health.json; then
              echo "Health check OK on attempt ${attempt}."
              cat /tmp/devpilot-health.json
              exit 0
            fi
            if [ "$code" = "404" ]; then
              echo "::error::Render homolog target became HTTP 404 while waiting; refusing to treat an unprovisioned/wrong service URL as a deploy in progress."
              cat /tmp/devpilot-health.json 2>/dev/null || true
              exit 1
            fi
            echo "attempt=${attempt} status=${code}; retrying in 10s"
            sleep 10
          done
          echo "::error::DevPilot homologation health did not become ready."
          cat /tmp/devpilot-health.json 2>/dev/null || true
          exit 1

      - name: Verify SPA root is published
        env:
          BASE_URL: ${{ steps.render.outputs.base_url }}
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -L -sS -o /tmp/devpilot-root.html -w '%{http_code}' --max-time 30 "${BASE_URL}/")
          if [ "$code" != "200" ]; then
            echo "::error::Root returned HTTP ${code}."
            cat /tmp/devpilot-root.html || true
            exit 1
          fi
          if grep -Eqi '^Not Found$|\{"detail":"Not Found"\}' /tmp/devpilot-root.html; then
            echo "::error::Root is still serving a Not Found response instead of the DevPilot SPA."
            cat /tmp/devpilot-root.html
            exit 1
          fi
          if ! grep -qi 'DevPilot' /tmp/devpilot-root.html; then
            echo "::error::Root returned 200 but does not look like the DevPilot frontend."
            head -c 1000 /tmp/devpilot-root.html
            exit 1
          fi
          echo "DevPilot SPA root is online."
