name: Fix auth bootstrap UI

on:
  push:
    branches:
      - fix/mobile-standard-top-back
    paths:
      - .github/workflows/fix-auth-bootstrap-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/mobile-standard-top-back
          fetch-depth: 0

      - name: Patch authentication bootstrap ordering
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('app/static/index.html')
          s = p.read_text(encoding='utf-8')

          legacy = '<dialog id="auth-modal"><form method="dialog" class="modal"><span class="eyebrow">ACESSO</span><h2>Conectar ao DevPilot</h2><p>Informe o token configurado em <code>DEVPILOT_BOOTSTRAP_TOKEN</code>.</p><label>Token<input id="token" type="password" autocomplete="current-password" required></label><button class="primary" id="save-token" value="default">Entrar</button></form></dialog>'
          safe = '<dialog id="auth-modal"><div class="modal" role="status" aria-live="polite"><span class="eyebrow">ACESSO</span><h2>Preparando acesso seguro…</h2><p>A autenticação será carregada automaticamente.</p></div></dialog>'
          if legacy in s:
              s = s.replace(legacy, safe, 1)

          app_tag = '  <script src="/assets/app.js" defer></script>'
          auth_tag = '  <script src="/assets/auth-ui.js" defer></script>'
          if auth_tag not in s:
              assert app_tag in s, 'app.js script tag not found'
              s = s.replace(app_tag, auth_tag + '\n' + app_tag, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate frontend auth contract
        run: |
          node --check app/static/auth-ui.js
          python - <<'PY'
          from pathlib import Path
          s = Path('app/static/index.html').read_text(encoding='utf-8')
          assert 'Informe o token configurado em <code>DEVPILOT_BOOTSTRAP_TOKEN</code>' not in s
          assert '<script src="/assets/auth-ui.js" defer></script>' in s
          assert s.index('/assets/auth-ui.js') < s.index('/assets/app.js')
          a = Path('app/static/auth-ui.js').read_text(encoding='utf-8')
          assert "BOOTSTRAP_DONE_KEY = 'devpilot-bootstrap-complete'" in a
          assert "endpoint === '/api/auth/bootstrap'" in a
          PY

      - name: Commit patch and remove one-shot workflow
        run: |
          git rm .github/workflows/fix-auth-bootstrap-ui.yml
          git add app/static/index.html
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix(auth): carregar fluxo persistente antes do app legado"
          git push origin HEAD:fix/mobile-standard-top-back
