name: Add DevPilot initial loading screen

on:
  push:
    branches:
      - fix/mobile-standard-top-back
    paths:
      - .github/workflows/add-initial-loading-screen.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-standard-top-back
          fetch-depth: 0
      - name: Implement branded initial loading screen
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/devpilot-initial-loader.py
          python /tmp/devpilot-initial-loader.py
          python -m py_compile app/main.py
          python tests/test_initial_loading_screen.py
          git rm .github/workflows/add-initial-loading-screen.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/main.py tests/test_initial_loading_screen.py
          git commit -m "feat(ui): adicionar splash inicial do DevPilot"
          git push origin HEAD:fix/mobile-standard-top-back
