name: Documentar issues

on:
  issues:
    types: [opened, edited, reopened, closed, labeled, unlabeled, assigned, unassigned, milestoned, demilestoned]

permissions:
  contents: write
  issues: read

concurrency:
  group: issue-documentation-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  sync-issue-document:
    runs-on: ${{ vars.DEVPILOT_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Gerar documento versionado da issue
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = `docs/issues/issue-${issue.number}.md`;
            const labels = (issue.labels || []).map(l => typeof l === 'string' ? l : l.name).filter(Boolean);
            const assignees = (issue.assignees || []).map(a => a.login);
            const milestone = issue.milestone ? issue.milestone.title : '—';
            const body = issue.body || '_Sem descrição._';
            const status = issue.state === 'closed' ? 'Fechada' : 'Aberta';
            const content = `# Issue #${issue.number} — ${issue.title}\n\n> Documento gerado automaticamente a partir da issue. Edite a issue no GitHub; este arquivo será sincronizado novamente.\n\n## Metadados\n\n- **Status:** ${status}\n- **Autor:** @${issue.user.login}\n- **Responsáveis:** ${assignees.length ? assignees.map(a => '@' + a).join(', ') : '—'}\n- **Labels:** ${labels.length ? labels.join(', ') : '—'}\n- **Milestone:** ${milestone}\n- **Criada em:** ${issue.created_at}\n- **Atualizada em:** ${issue.updated_at}\n- **Fonte:** ${issue.html_url}\n\n## Planejado / descrição da issue\n\n${body}\n\n## Regra de revisão\n\nA PR deve referenciar esta issue e comparar **planejado x implementado x resultado observável/tela**. Mudanças visuais exigem evidência antes/depois; mudanças não visuais exigem evidência equivalente.\n`;
            let sha;
            try { const existing = await github.rest.repos.getContent({ owner, repo, path }); if (!Array.isArray(existing.data)) sha = existing.data.sha; } catch (error) { if (error.status !== 404) throw error; }
            await github.rest.repos.createOrUpdateFileContents({ owner, repo, path, message: `docs(issue): sincroniza issue #${issue.number}`, content: Buffer.from(content, 'utf8').toString('base64'), sha });
