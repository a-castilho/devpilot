name: DevPilot PR Auto Repair

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  actions: write
  pull-requests: read
  issues: write

concurrency:
  group: devpilot-pr-auto-repair-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  repair:
    name: Repair failed PR CI
    if: >-
      ${{
        vars.DEVPILOT_RUNNER != '' &&
        (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out') &&
        github.event.workflow_run.head_branch != 'main' &&
        github.event.workflow_run.head_branch != 'master' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      }}
    runs-on: ${{ vars.DEVPILOT_RUNNER }}
    timeout-minutes: 50
    env:
      DEVPILOT_FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
      DEVPILOT_FAILED_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      DEVPILOT_FAILED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      DEVPILOT_FAILED_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}

    steps:
      - name: Checkout failed PR branch without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify self-hosted repair runtime
        run: |
          command -v python3
          command -v git
          command -v gh
          command -v codex
          python3 --version
          codex --version

      - name: Install package, test and browser dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e '.[test,e2e]'
          python3 -m playwright install chromium

      - name: Materialize trusted controller from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TRUSTED_CONTROLLER="$RUNNER_TEMP/devpilot-pr-auto-repair-${GITHUB_RUN_ID}.py"
          gh api "repos/${GITHUB_REPOSITORY}/contents/scripts/pr_auto_repair.py?ref=main" \
            --jq '.content' | base64 --decode > "$TRUSTED_CONTROLLER"
          chmod 600 "$TRUSTED_CONTROLLER"
          echo "DEVPILOT_TRUSTED_CONTROLLER=$TRUSTED_CONTROLLER" >> "$GITHUB_ENV"

      - name: Repair, validate and re-dispatch CI
        env:
          DEVPILOT_GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import importlib.util
          import os
          from pathlib import Path

          controller = Path(os.environ["DEVPILOT_TRUSTED_CONTROLLER"]).resolve()
          spec = importlib.util.spec_from_file_location("devpilot_pr_auto_repair_trusted", controller)
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)
          raise SystemExit(module.main())
          PY

      - name: Publish repair audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-auto-repair-${{ github.event.workflow_run.id }}-${{ github.run_attempt }}
          path: .artifacts/pr-auto-repair/report.json
          if-no-files-found: warn
          retention-days: 30
