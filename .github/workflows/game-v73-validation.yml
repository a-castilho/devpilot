name: Game v73 validation

on:
  push:
    branches:
      - validate/game-v73
  workflow_dispatch:

permissions:
  contents: read

jobs:
  game-v73:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,e2e]'

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Validate game contracts
        run: |
          python -m pytest -q \
            tests/test_game_unified_v73.py \
            tests/test_game_unified_v73_validation_marker.py

      - name: Validate legacy game regression suite
        run: |
          python -m pytest -q \
            tests/test_game_action_runtime_recovery_v57.py \
            tests/test_game_core_first_no_freeze_v60.py \
            tests/test_game_entry_blank_mobile_v59.py \
            tests/test_game_entry_stability_v64.py \
            tests/test_game_mobile_fast_v63.py \
            tests/test_game_nonblocking_entry_v67.py \
            tests/test_game_retry_progress_v62.py

      - name: JavaScript syntax
        run: |
          node --check app/static/build-game.js
          node --check app/static/game/runtime.js
          node --check app/static/game/game-bootstrap.js
          node --check app/static/game/objective-controls.js
          node --check app/static/game/task-payload-guard.js
          node --check app/static/game/delivery-gate.js

      - name: Browser E2E game tests
        env:
          DEVPILOT_RUN_BROWSER_E2E: "1"
        run: |
          python -m pytest -q \
            tests/test_game_browser_e2e.py \
            tests/test_isolated_game_runtime.py
