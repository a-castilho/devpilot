name: Restore project name on dashboard

on:
  push:
    branches:
      - fix/mobile-standard-top-back
    paths:
      - .github/workflows/restore-project-name-dashboard.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-standard-top-back
          fetch-depth: 0
      - name: Restore project name in recent executions
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('app/static/app.js')
          text = app.read_text(encoding='utf-8')
          old = """        <span class=\"task-copy\"><strong>${esc(task.title)}</strong><small>${new Date(task.created_at).toLocaleString('pt-BR')} · ${esc(task.source || 'dashboard')}</small></span>"""
          new = """        <span class=\"task-copy\"><strong>${esc(task.title)}</strong><small><b class=\"task-project-name\">${esc(task.project_name || 'Projeto não identificado')}</b> · ${new Date(task.created_at).toLocaleString('pt-BR')} · ${esc(task.source || 'dashboard')}</small></span>"""
          if old not in text:
              raise SystemExit('Trecho esperado de renderização das execuções recentes não encontrado')
          app.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('tests/test_dashboard_user_v21_contract.py')
          t = test.read_text(encoding='utf-8')
          needle = "    assert \"#metrics\" in runtime\n"
          addition = (
              "    app = (ROOT / 'app/static/app.js').read_text(encoding='utf-8')\n"
              "    assert 'task.project_name' in app\n"
              "    assert 'task-project-name' in app\n"
          )
          if addition not in t:
              if needle not in t:
                  raise SystemExit('Ponto de inserção do contrato não encontrado')
              t = t.replace(needle, needle + addition, 1)
              test.write_text(t, encoding='utf-8')
          PY
          python tests/test_dashboard_user_v21_contract.py
          git rm .github/workflows/restore-project-name-dashboard.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/static/app.js tests/test_dashboard_user_v21_contract.py
          git commit -m "fix(ui): restaurar nome do projeto nas execuções recentes"
          git push origin HEAD:fix/mobile-standard-top-back
