name: Focused security validation

on:
  push:
    branches:
      - test/integration-worker-git-local-validation-v2

permissions:
  contents: read

concurrency:
  group: focused-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-security:
    name: Worker Git and task-image focused tests
    runs-on: ${{ vars.DEVPILOT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused test dependencies
        run: python -m pip install -e '.[test]'

      - name: Run focused security regressions
        run: >-
          python -m pytest -q
          tests/test_worker_lease_fencing.py
          tests/test_git_credential_boundary.py
          tests/test_task_images.py
          tests/test_task_image_workspace_routes.py
