name: Fix bootstrap token once

on:
  push:
    branches:
      - fix/mobile-standard-top-back
    paths:
      - .github/workflows/fix-bootstrap-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/mobile-standard-top-back
          fetch-depth: 0

      - name: Patch one-time bootstrap behavior
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('app/static/auth-ui.js')
          s = p.read_text()

          old = "  const TOKEN_KEY = 'devpilot-token';\n  const AUTH_MESSAGE_KEY = 'devpilot-auth-message';"
          new = "  const TOKEN_KEY = 'devpilot-token';\n  const BOOTSTRAP_DONE_KEY = 'devpilot-bootstrap-complete';\n  const AUTH_MESSAGE_KEY = 'devpilot-auth-message';"
          assert old in s, 'token constants block not found'
          s = s.replace(old, new, 1)

          old = "      bootstrapRequired = Boolean(data.bootstrap_required);\n      localBootstrapAvailable = Boolean(data.local_bootstrap_available);"
          new = "      const serverBootstrapRequired = Boolean(data.bootstrap_required);\n      const bootstrapAlreadyCompleted = localStorage.getItem(BOOTSTRAP_DONE_KEY) === '1';\n      if (!serverBootstrapRequired) localStorage.setItem(BOOTSTRAP_DONE_KEY, '1');\n      bootstrapRequired = serverBootstrapRequired && !bootstrapAlreadyCompleted;\n      localBootstrapAvailable = bootstrapRequired && Boolean(data.local_bootstrap_available);"
          assert old in s, 'readStatus block not found'
          s = s.replace(old, new, 1)

          old = "        localStorage.setItem(TOKEN_KEY, data.access_token); sessionStorage.removeItem(AUTH_MESSAGE_KEY);"
          new = "        localStorage.setItem(TOKEN_KEY, data.access_token);\n        if (endpoint === '/api/auth/bootstrap') localStorage.setItem(BOOTSTRAP_DONE_KEY, '1');\n        sessionStorage.removeItem(AUTH_MESSAGE_KEY);"
          assert old in s, 'successful auth storage block not found'
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY

      - name: Validate JavaScript and contract
        run: |
          node --check app/static/auth-ui.js
          python - <<'PY'
          from pathlib import Path
          s = Path('app/static/auth-ui.js').read_text()
          assert "BOOTSTRAP_DONE_KEY = 'devpilot-bootstrap-complete'" in s
          assert "serverBootstrapRequired && !bootstrapAlreadyCompleted" in s
          assert "endpoint === '/api/auth/bootstrap'" in s
          PY

      - name: Remove one-shot workflow and commit
        run: |
          git rm .github/workflows/fix-bootstrap-once.yml
          git add app/static/auth-ui.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix(auth): solicitar bootstrap apenas no primeiro acesso"
          git push origin HEAD:fix/mobile-standard-top-back
