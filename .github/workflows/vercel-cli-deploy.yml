name: Deploy DevPilot to Vercel via CLI

on:
  workflow_dispatch:
  push:
    branches:
      - fix/mobile-standard-top-back
    paths:
      - 'app/static/**'
      - 'tools/build-vercel-static.mjs'
      - 'vercel.json'
      - '.github/workflows/vercel-cli-deploy.yml'
      - '.deploy/vercel-backend-target.txt'

concurrency:
  group: devpilot-vercel-homolog
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Homolog frontend deploy
    runs-on: ${{ vars.DEVPILOT_RUNNER || 'ubuntu-latest' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Vercel credentials
        id: vercel_auth
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::error::VERCEL_TOKEN is not configured."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ensure Vercel project exists
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if ! npx --yes vercel@latest project inspect devpilot \
            --token "$VERCEL_TOKEN" \
            --scope maquina-de-leads1 >/dev/null 2>&1; then
            npx --yes vercel@latest project add devpilot \
              --token "$VERCEL_TOKEN" \
              --scope maquina-de-leads1
          fi

      - name: Validate backend before frontend deploy
        shell: bash
        run: |
          BACKEND_URL="$(tr -d '\r\n' < .deploy/vercel-backend-target.txt)"
          echo "Waiting for ${BACKEND_URL}/health"
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 8 "${BACKEND_URL}/health" >/dev/null; then
              echo "Backend ready"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Backend Docker did not become healthy in time"
          exit 1

      - name: Deploy production with Vercel CLI
        id: deploy
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          URL="$(npx --yes vercel@latest deploy \
            --prod \
            --non-interactive \
            --token "$VERCEL_TOKEN" \
            --scope maquina-de-leads1 \
            --project devpilot)"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployment URL: $URL"

      - name: Attach homologation alias
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          npx --yes vercel@latest alias set "$DEPLOYMENT_URL" devpilot-homolog.vercel.app \
            --token "$VERCEL_TOKEN" \
            --scope maquina-de-leads1

      - name: Verify frontend and backend routing
        shell: bash
        run: |
          for attempt in $(seq 1 24); do
            FRONT=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 8 https://devpilot-homolog.vercel.app || true)
            HEALTH=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 8 https://devpilot-homolog.vercel.app/health || true)
            if [ "$FRONT" -ge 200 ] && [ "$FRONT" -lt 400 ] && [ "$HEALTH" -ge 200 ] && [ "$HEALTH" -lt 400 ]; then
              echo "Vercel homolog ready: frontend=$FRONT health=$HEALTH"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Vercel homologation did not become ready in time"
          exit 1
