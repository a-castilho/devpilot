name: Deploy DevPilot to Vercel via CLI

# This workflow deploys the private organization repository through Vercel CLI.
# Required repository secret: VERCEL_TOKEN.

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: devpilot-vercel-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Production deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Vercel credentials
        id: vercel_auth
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::VERCEL_TOKEN is not configured. Add it in GitHub repository Settings > Secrets and variables > Actions."
            exit 0
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: steps.vercel_auth.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy production with Vercel CLI
        if: steps.vercel_auth.outputs.ready == 'true'
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx --yes vercel@latest deploy \
            --prod \
            --non-interactive \
            --token "$VERCEL_TOKEN" \
            --scope maquina-de-leads1 \
            --project devpilot
