name: Deploy DevPilot to Vercel via CLI

on:
  workflow_dispatch:
  push:
    branches:
      - fix/mobile-standard-top-back
    paths:
      - 'app/static/**'
      - 'tools/build-vercel-static.mjs'
      - 'vercel.json'
      - '.github/workflows/vercel-cli-deploy.yml'
      - '.deploy/vercel-backend-target.txt'

concurrency:
  group: devpilot-vercel-homolog
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Homolog frontend deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Vercel credentials
        id: vercel_auth
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN is not configured."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ensure Vercel project exists without prompt
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: team_KrFJ87iJN82qsZ56d8eKsvqJ
        run: |
          set -euo pipefail
          STATUS=$(curl -sS -o /tmp/vercel-project.json -w '%{http_code}' \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/devpilot?teamId=$VERCEL_TEAM_ID")
          if [ "$STATUS" = "200" ]; then
            echo "Vercel project devpilot already exists"
          elif [ "$STATUS" = "404" ]; then
            CREATE=$(curl -sS -o /tmp/vercel-project-create.json -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H 'Content-Type: application/json' \
              "https://api.vercel.com/v10/projects?teamId=$VERCEL_TEAM_ID" \
              --data '{"name":"devpilot","framework":null}')
            if [ "$CREATE" -lt 200 ] || [ "$CREATE" -ge 300 ]; then
              cat /tmp/vercel-project-create.json
              echo "::error::Failed to create Vercel project (HTTP $CREATE)"
              exit 1
            fi
            echo "Vercel project devpilot created"
          else
            cat /tmp/vercel-project.json
            echo "::error::Unable to inspect Vercel project (HTTP $STATUS)"
            exit 1
          fi

      - name: Validate backend before frontend deploy
        shell: bash
        run: |
          BACKEND_URL="$(tr -d '\r\n' < .deploy/vercel-backend-target.txt)"
          echo "Waiting for ${BACKEND_URL}/health"
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 8 "${BACKEND_URL}/health" >/dev/null; then
              echo "Backend ready"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Backend Docker did not become healthy in time"
          exit 1

      - name: Deploy production with Vercel CLI
        id: deploy
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          URL="$(npx --yes vercel@latest deploy \
            --prod \
            --yes \
            --token "$VERCEL_TOKEN" \
            --scope maquina-de-leads1 \
            --project devpilot)"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployment URL: $URL"

      - name: Attach homologation aliases
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          for ALIAS in devpilot-homolog.vercel.app pilot-homolog.vercel.app; do
            npx --yes vercel@latest alias set "$DEPLOYMENT_URL" "$ALIAS" \
              --token "$VERCEL_TOKEN" \
              --scope maquina-de-leads1
          done

      - name: Verify frontend and backend routing
        shell: bash
        run: |
          for HOST in devpilot-homolog.vercel.app pilot-homolog.vercel.app; do
            READY=0
            for attempt in $(seq 1 24); do
              FRONT=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 8 "https://${HOST}" || true)
              HEALTH=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 8 "https://${HOST}/health" || true)
              if [ "$FRONT" -ge 200 ] && [ "$FRONT" -lt 400 ] && [ "$HEALTH" -ge 200 ] && [ "$HEALTH" -lt 400 ]; then
                echo "Vercel homolog ready: host=$HOST frontend=$FRONT health=$HEALTH"
                READY=1
                break
              fi
              sleep 5
            done
            if [ "$READY" != "1" ]; then
              echo "::error::Vercel homologation did not become ready for $HOST in time"
              exit 1
            fi
          done
