name: Deploy DevPilot Frontend to Vercel

on:
  workflow_dispatch:
  push:
    branches:
      - fix/mobile-standard-top-back
    paths:
      - 'app/static/**'
      - 'tools/build-vercel-static.mjs'
      - 'vercel.json'
      - '.github/workflows/vercel-cli-deploy.yml'

concurrency:
  group: devpilot-vercel-homolog
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy frontend Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: homologation

    env:
      VERCEL_SCOPE: maquina-de-leads1
      VERCEL_PROJECT: devpilot
      VERCEL_ALIAS: devpilot-homolog.vercel.app
      DEVPILOT_BACKEND_URL: https://devpilot-homolog.onrender.com

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/mobile-standard-top-back

      - name: Validate Vercel credentials
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN" || { echo "::error::VERCEL_TOKEN is not configured for DevPilot."; exit 1; }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ensure Vercel project exists
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if ! npx --yes vercel@latest project inspect "$VERCEL_PROJECT" --token "$VERCEL_TOKEN" --scope "$VERCEL_SCOPE" >/dev/null 2>&1; then
            npx --yes vercel@latest project add "$VERCEL_PROJECT" --token "$VERCEL_TOKEN" --scope "$VERCEL_SCOPE"
          fi

      - name: Link repository workspace to Vercel project
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx --yes vercel@latest link --yes --project "$VERCEL_PROJECT" --token "$VERCEL_TOKEN" --scope "$VERCEL_SCOPE"

      - name: Configure Render backend URL in Vercel
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx --yes vercel@latest env rm DEVPILOT_BACKEND_URL production --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_SCOPE" >/dev/null 2>&1 || true
          printf '%s' "$DEVPILOT_BACKEND_URL" | npx --yes vercel@latest env add DEVPILOT_BACKEND_URL production --token "$VERCEL_TOKEN" --scope "$VERCEL_SCOPE"

      - name: Deploy frontend
        id: deploy
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          URL=$(npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_SCOPE")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          npx --yes vercel@latest alias set "$URL" "$VERCEL_ALIAS" --token "$VERCEL_TOKEN" --scope "$VERCEL_SCOPE"

      - name: Verify frontend and backend gateway
        shell: bash
        run: |
          curl --fail --silent --show-error --location --output /dev/null "https://$VERCEL_ALIAS/"
          curl --fail --silent --show-error --location "https://$VERCEL_ALIAS/health"
          echo "Frontend primário: https://$VERCEL_ALIAS" >> "$GITHUB_STEP_SUMMARY"
          echo "Frontend backup / backend: $DEVPILOT_BACKEND_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployment: ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"

# Provisionamento acionado em 2026-09-10 para garantir Vercel como frontend principal.
# Publicação acionada após corrigir bootstrap para uso único.