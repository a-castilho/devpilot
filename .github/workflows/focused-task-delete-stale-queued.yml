name: Focused task delete stale queued

on:
  push:
    branches:
      - fix/task-delete-stale-queued

jobs:
  focused:
    name: Task delete stale queued
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install -q -e '.[test]'

      - name: Python compile
        run: python -m compileall -q app/project_delete_routes.py tests/test_task_delete.py

      - name: JavaScript syntax
        run: node --check app/static/task-completion-documentation.js

      - name: Focused delete tests
        run: python -m pytest -q --tb=short tests/test_task_delete.py

      - name: Adjacent orchestrator tests
        run: python -m pytest -q --tb=short tests/test_task_orchestrator.py
