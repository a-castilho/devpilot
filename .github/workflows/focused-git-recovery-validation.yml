name: Focused Git recovery validation

on:
  push:
    branches:
      - test/integration-worker-git-local-validation-v2

permissions:
  contents: read

concurrency:
  group: focused-git-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recovery:
    name: Registered credential recovery
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout security branch
        uses: actions/checkout@v4
        with:
          ref: 15a70a81dfc38e5cdbfc37984532c5e5f2c2256a
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Compile recovery service
        run: python -m compileall -q app/services/recovery.py tests/test_recovery_existing_github_credential.py
      - name: Run focused Git credential recovery tests
        run: python -m pytest -q --tb=short tests/test_recovery_existing_github_credential.py tests/test_git_credential_boundary.py
