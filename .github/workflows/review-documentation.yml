name: Documentar revisões de PR

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review, closed]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: review-documentation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sync-review-document:
    runs-on: ubuntu-latest
    steps:
      - name: Gerar relatório versionado da revisão
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = `docs/reviews/pr-${pr.number}.md`;
            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: pr.number, per_page: 100 });
            const body = pr.body || '_Sem descrição._';
            const changedFiles = files.length ? files.map(f => `- \`${f.filename}\` (+${f.additions}/-${f.deletions})`).join('\n') : '_Nenhum arquivo listado._';
            const hasIssueReference = /(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)?\s*#\d+/i.test(body) || /\/issues\/\d+/i.test(body);
            const hasVisualEvidence = /!\[[^\]]*\]\([^\)]+\)|<img\b|user-attachments|private-user-images|\.png\b|\.jpe?g\b|\.webp\b/i.test(body);
            const likelyUiChange = files.some(f => /(^|\/)(frontend|src|app|pages|components|ui|views|templates)(\/|$)|\.(tsx|jsx|vue|svelte|css|scss|html)$/i.test(f.filename));
            const state = pr.merged ? 'Merged' : (pr.state === 'closed' ? 'Fechada sem merge' : (pr.draft ? 'Draft' : 'Aberta'));
            const content = `# Revisão PR #${pr.number} — ${pr.title}\n\n> Relatório gerado automaticamente.\n\n## Metadados\n\n- **Estado:** ${state}\n- **Autor:** @${pr.user.login}\n- **Base:** \`${pr.base.ref}\`\n- **Head:** \`${pr.head.ref}\`\n- **Atualizada em:** ${pr.updated_at}\n- **Fonte:** ${pr.html_url}\n\n## Sinais automáticos de revisão\n\n- **Referência de issue detectada:** ${hasIssueReference ? 'SIM' : 'NÃO'}\n- **Mudança de UI provável:** ${likelyUiChange ? 'SIM' : 'NÃO'}\n- **Evidência visual detectada:** ${hasVisualEvidence ? 'SIM' : 'NÃO'}\n- **Arquivos alterados:** ${files.length}\n\n> Se houver UI provável sem evidência visual, a revisão deve pedir screenshot/registro ou justificativa explícita.\n\n## Arquivos alterados\n\n${changedFiles}\n\n## Descrição e evidências da PR\n\n${body}\n\n## Comparação obrigatória\n\n1. Issue e critérios de aceite.\n2. Diff e arquivos alterados.\n3. Resultado observável/tela.\n4. Divergências antes do merge.\n`;
            let sha;
            try { const existing = await github.rest.repos.getContent({ owner, repo, path }); if (!Array.isArray(existing.data)) sha = existing.data.sha; } catch (error) { if (error.status !== 404) throw error; }
            await github.rest.repos.createOrUpdateFileContents({ owner, repo, path, message: `docs(review): sincroniza PR #${pr.number}`, content: Buffer.from(content, 'utf8').toString('base64'), sha });
