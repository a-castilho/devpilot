name: Game v80 validation

on:
  push:
    branches:
      - feat/game-development-continuity-v80

permissions:
  contents: read

concurrency:
  group: game-v80-${{ github.ref }}
  cancel-in-progress: true

jobs:
  game-v80:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DEVPILOT_RUN_BROWSER_E2E: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install -e '.[test,e2e]'

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: JavaScript syntax
        run: |
          node --check app/static/game/runtime.js
          node --check app/static/build-game.js
          node --check app/static/game/game-bootstrap.js
          node --check app/static/game/task-payload-guard.js
          node --check app/static/game/objective-controls.js
          node --check app/static/game/development-continuity.js
          node --check app/static/game/delivery-gate.js
          node --check app/static/game/flow-keeper.js
          node --check app/static/game/final-delivery-summary.js
          node --check app/static/build-game-url-bonus.js

      - name: Full game contracts
        run: |
          python -m pytest -q tests/test_game*.py

      - name: Development continuity dependencies
        run: |
          python -m pytest -q \
            tests/test_failure_recovery_flow_contract.py \
            tests/test_build_game_final_delivery.py \
            tests/test_project_delivery_history_ui.py \
            tests/test_projects_mobile_runtime_guard.py
