name: Local Linux Smoke

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "tests/**"
      - "scripts/**"
      - "Dockerfile"
      - "docker-compose*.yml"
      - "pyproject.toml"
      - ".github/workflows/local-linux-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devpilot-local-linux-smoke
  cancel-in-progress: true

jobs:
  local-linux-smoke:
    name: DevPilot local Linux smoke
    runs-on: ${{ vars.DEVPILOT_RUNNER || 'self-hosted' }}
    timeout-minutes: 25
    steps:
      - name: Checkout repository snapshot
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect fast static-only smoke
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "fast=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BEFORE="${{ github.event.before }}"
          if [[ -z "$BEFORE" || "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
            BEFORE="$(git rev-parse HEAD^)"
          fi
          mapfile -t FILES < <(git diff --name-only "$BEFORE" HEAD)
          FAST=true
          [[ ${#FILES[@]} -gt 0 ]] || FAST=false
          for path in "${FILES[@]}"; do
            case "$path" in
              app/static/*|tests/test_*ui*.py|tests/test_*frontend*.py|tests/test_game_*contract.py)
                ;;
              *) FAST=false; break ;;
            esac
          done
          echo "fast=$FAST" >> "$GITHUB_OUTPUT"
          echo "Fast static smoke: $FAST"

      - name: Validate changed static JavaScript
        if: steps.scope.outputs.fast == 'true'
        shell: bash
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          if [[ -z "$BEFORE" || "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
            BEFORE="$(git rev-parse HEAD^)"
          fi
          mapfile -t JS_FILES < <(git diff --name-only "$BEFORE" HEAD -- 'app/static/**/*.js' 'app/static/*.js')
          for file in "${JS_FILES[@]}"; do
            [[ -f "$file" ]] || continue
            node --check "$file"
          done
          python3 -m compileall -q tests
          echo "LOCAL_FAST_STATIC_SMOKE_OK"

      - name: Validate consolidated source contracts
        if: steps.scope.outputs.fast != 'true'
        run: |
          set -euo pipefail
          node --check app/static/project-builder.js
          node --check app/static/feature-loader.js
          node --check app/static/build-game.js
          node --check app/static/game/objective-controls.js
          node --check app/static/game/recovery-runtime.js
          node --check app/static/project-builder-mobile-runtime-v39.js
          node --check app/static/mobile-game-ships-stable.js
          grep -q 'id="project-builder-groups" hidden' app/static/project-builder.js
          grep -q 'data-simple-builder-ready="1"' app/static/project-builder.js
          grep -q "window.__devpilotGameControllerV73" app/static/build-game.js
          grep -q "await engine.startRound({projectId, goal: targetGoal})" app/static/game/objective-controls.js
          grep -q "provision_repository_in_background" app/project_provisioning_routes.py
          grep -q "repository_provision_state" app/project_provisioning_routes.py
          grep -q "Project Builder Mobile V39 virtualizado" app/static/project-builder-mobile-runtime-v39.js
          python -m pytest -q tests/test_project_builder_loader_contract.py tests/test_game_unified_v73.py
          echo "SOURCE_CONTRACTS_OK"

      - name: Update actual local Linux checkout safely
        if: steps.scope.outputs.fast != 'true'
        run: |
          set -euo pipefail
          LOCAL_REPO="$HOME/Documents/devpilot"
          test -d "$LOCAL_REPO/.git"
          cd "$LOCAL_REPO"
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "LOCAL_WORKTREE_DIRTY"
            git status --short
            exit 42
          fi
          git fetch origin main
          git switch main
          git pull --ff-only origin main
          echo "LOCAL_COMMIT=$(git rev-parse HEAD)"
          git log -1 --oneline

      - name: Build and start local app
        if: steps.scope.outputs.fast != 'true'
        run: |
          set -euo pipefail
          cd "$HOME/Documents/devpilot"
          docker compose up -d --build postgres redis app

      - name: Wait for local health
        if: steps.scope.outputs.fast != 'true'
        run: |
          set -euo pipefail
          for i in $(seq 1 45); do
            if curl -fsS --max-time 3 http://127.0.0.1:8080/health > /tmp/devpilot-health.json; then
              cat /tmp/devpilot-health.json
              exit 0
            fi
            sleep 2
          done
          cd "$HOME/Documents/devpilot"
          docker compose logs --tail=120 app postgres || true
          exit 1

      - name: Verify project and game runtime are served locally
        if: steps.scope.outputs.fast != 'true'
        run: |
          set -euo pipefail
          cd "$HOME/Documents/devpilot"
          grep -q "provision_repository_in_background" app/project_provisioning_routes.py
          grep -q "repository_provision_state" app/project_provisioning_routes.py
          curl -fsS --max-time 5 http://127.0.0.1:8080/assets/project-builder.js | grep -q 'data-simple-builder-ready="1"'
          curl -fsS --max-time 5 http://127.0.0.1:8080/assets/feature-loader.js | grep -q "project-builder-groups"
          curl -fsS --max-time 5 http://127.0.0.1:8080/assets/build-game.js | grep -q "window.__devpilotGameControllerV73"
          curl -fsS --max-time 5 http://127.0.0.1:8080/assets/game/objective-controls.js | grep -q "Jogar agora"
          curl -fsS --max-time 5 http://127.0.0.1:8080/assets/project-builder-mobile-runtime-v39.js | grep -q "Project Builder Mobile V39 virtualizado"
          curl -fsS --max-time 5 http://127.0.0.1:8080/assets/mobile-accordion-menu.js | grep -q "game-ships-stable-20260903-v39"
          docker compose exec -T app python -m compileall -q app
          docker compose exec -T app python - <<'PY'
          from app.project_provisioning_routes import provision_repository_in_background
          assert callable(provision_repository_in_background)
          print('PROJECT_PROVISION_BACKGROUND_OK')
          PY
          echo "LOCAL_LINUX_SMOKE_OK"

      - name: Show diagnostics on failure
        if: failure() && steps.scope.outputs.fast != 'true'
        run: |
          cd "$HOME/Documents/devpilot" 2>/dev/null || exit 0
          echo "=== GIT ==="
          git status --short || true
          git log -1 --oneline || true
          echo "=== APP LOG ==="
          docker compose logs --tail=160 app postgres || true
