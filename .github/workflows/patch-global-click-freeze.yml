name: Patch global click freeze

on:
  push:
    branches:
      - fix/global-click-freeze-20260904

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'fix(ui): make navigation nonblocking') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/global-click-freeze-20260904
          fetch-depth: 0

      - name: Patch feature loader
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/static/feature-loader.js')
          text = path.read_text(encoding='utf-8')

          old = '''  async function navigateDirect(viewName, source = 'link') {
            if (!viewName) return false;
            navigationEpoch += 1;
            restorePendingPlaceholders();

            const feature = VIEW_FEATURES[viewName];
            if (feature) {
              const ready = await loadFeature(feature);
              if (!ready) window.toast?.('Tela aberta com alguns recursos opcionais indisponíveis.');
            }

            if (typeof window.devpilotNavigate === 'function') {
              return window.devpilotNavigate(viewName, {source, immediate:true});
            }
            if (typeof showView === 'function') {
              showView(viewName);
              return true;
            }
            return false;
          }
'''

          new = '''  async function navigateDirect(viewName, source = 'link') {
            if (!viewName) return false;
            navigationEpoch += 1;
            const intentEpoch = navigationEpoch;
            restorePendingPlaceholders();

            // Navegação é operação de UI e nunca deve esperar bundle opcional.
            // Mostra a view no mesmo clique e hidrata recursos em segundo plano.
            let navigated = false;
            if (typeof window.devpilotNavigate === 'function') {
              navigated = window.devpilotNavigate(viewName, {source, immediate:true});
            } else if (typeof showView === 'function') {
              showView(viewName);
              navigated = true;
            }

            const feature = VIEW_FEATURES[viewName];
            if (feature) {
              void loadFeature(feature, {intentEpoch}).then(ready => {
                if (intentEpoch !== navigationEpoch) return;
                if (!ready) window.toast?.('Tela aberta com alguns recursos opcionais indisponíveis.');
              }).catch(error => {
                if (intentEpoch !== navigationEpoch) return;
                console.error(`[DevPilot] Falha ao hidratar ${viewName}`, error);
                window.toast?.('Tela aberta; recursos opcionais serão tentados novamente depois.');
              });
            }

            return navigated;
          }
'''

          if new in text:
              print('navigateDirect already patched')
          elif old not in text:
              raise SystemExit('expected navigateDirect block not found')
          else:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
              print('navigateDirect patched')
          PY

          node --check app/static/feature-loader.js
          python -m pytest -q tests/test_navigation_click_nonblocking.py tests/test_workspace_skins_click_safety.py

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "devpilot-fix-bot"
          git config user.email "devpilot-fix-bot@users.noreply.github.com"
          git add app/static/feature-loader.js
          if git diff --cached --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git commit -m "fix(ui): make navigation nonblocking"
          git push origin HEAD:fix/global-click-freeze-20260904
