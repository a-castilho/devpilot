name: Apply game development continuity v80

on:
  push:
    branches:
      - feat/game-development-continuity-v80

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/game-development-continuity-v80
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply integration
        run: |
          python scripts/apply_game_v80.py
          python scripts/apply_game_v80_followup.py

      - name: Install test dependencies
        run: python -m pip install -e '.[test]'

      - name: Validate JavaScript
        run: |
          node --check app/static/game/development-continuity.js
          node --check app/static/game/runtime.js
          node --check app/static/game/game-bootstrap.js
          node --check app/static/game/task-payload-guard.js
          node --check app/static/game/delivery-gate.js
          node --check app/static/game/flow-keeper.js
          node --check app/static/game/final-delivery-summary.js
          node --check app/static/build-game-url-bonus.js

      - name: Validate v80 contracts
        run: |
          python -m pytest -q \
            tests/test_game_development_continuity_v80.py \
            tests/test_game_ships_stable_runtime_contract.py \
            tests/test_game_delivery_gate.py \
            tests/test_failure_recovery_flow_contract.py

      - name: Commit integrated game
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app tests
          if git diff --cached --quiet; then
            echo 'GAME_V80_ALREADY_APPLIED=1'
            exit 0
          fi
          git commit -m 'feat(game): consolidar continuidade multi-projeto v80'
          git push origin HEAD:feat/game-development-continuity-v80
