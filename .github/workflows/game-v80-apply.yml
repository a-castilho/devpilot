name: Apply game development continuity v80

on:
  push:
    branches: [feat/game-development-continuity-v80]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/game-development-continuity-v80
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply v80 integration patches
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'pattern not found in {path}: {old[:100]!r}')
              text = text.replace(old, new, count)
              p.write_text(text, encoding='utf-8')

          # Compact project list: pagination + delivery mode without exposing codex_config.
          path = Path('app/frontend_ui_routes.py')
          text = path.read_text(encoding='utf-8')
          if 'def _project_delivery_mode' not in text:
              text = text.replace('from __future__ import annotations\n\n', 'from __future__ import annotations\n\nimport json\n\n', 1)
              marker = 'def _project_summary(row) -> dict:\n'
              helper = '''_WEB_PROJECT_TYPES = {\n    "saas", "hotsite", "landing-page", "personal-site", "portfolio",\n    "institutional-site", "blog-portal", "ecommerce", "docs-site", "admin", "pwa",\n}\n\n\ndef _project_delivery_mode(codex_config: str | None) -> str:\n    try:\n        config = json.loads(codex_config or "{}")\n    except (TypeError, ValueError, json.JSONDecodeError):\n        return "code"\n    blueprint = config.get("project_blueprint") if isinstance(config, dict) else None\n    if not isinstance(blueprint, dict):\n        return "code"\n\n    def values(key: str) -> set[str]:\n        raw = blueprint.get(key) or []\n        if isinstance(raw, str):\n            raw = [raw]\n        return {str(item).strip().lower() for item in raw if str(item).strip()} if isinstance(raw, list) else set()\n\n    project_types = values("project_type")\n    frontend = values("frontend")\n    if project_types.intersection(_WEB_PROJECT_TYPES):\n        return "web"\n    if frontend and not frontend.issubset({"none", "nenhum"}):\n        return "web"\n    if project_types.intersection({"api", "microservices"}):\n        return "service"\n    return "code"\n\n\n'''
              if marker not in text:
                  raise SystemExit('project summary marker missing')
              text = text.replace(marker, helper + marker, 1)
              text = text.replace('        "status": row.status,\n        "created_at": row.created_at,', '        "status": row.status,\n        "delivery_mode": _project_delivery_mode(row.codex_config),\n        "created_at": row.created_at,', 1)
              text = text.replace('    limit: int = Query(50, ge=1, le=100),\n    include_project_id: str | None = None,', '    limit: int = Query(50, ge=1, le=100),\n    offset: int = Query(0, ge=0, le=10_000),\n    include_project_id: str | None = None,', 1)
              text = text.replace('        Project.status,\n        Project.created_at,', '        Project.status,\n        Project.codex_config,\n        Project.created_at,', 1)
              text = text.replace('            .order_by(Project.created_at.desc())\n            .limit(limit)', '            .order_by(Project.created_at.desc())\n            .offset(offset)\n            .limit(limit)', 1)
              text = text.replace('    limit: int = Query(24, ge=1, le=50),', '    limit: int = Query(80, ge=1, le=100),', 1)
              path.write_text(text, encoding='utf-8')

          # Standalone runtime: larger compact history, all project pages, current user for delivery permissions.
          path = Path('app/static/game/runtime.js')
          text = path.read_text(encoding='utf-8')
          text = text.replace('  projects: [],\n};', '  projects: [],\n  currentUser: null,\n};', 1)
          text = text.replace('/ui/projects?limit=50', '/ui/projects?limit=100', 1)
          text = text.replace('&limit=24`', '&limit=80`', 1)
          path.write_text(text, encoding='utf-8')

          # Creation recovery and gate must see the whole current mission after retries.
          for filename in ('app/static/game/task-payload-guard.js', 'app/static/game/delivery-gate.js'):
              p = Path(filename)
              data = p.read_text(encoding='utf-8').replace('limit=24', 'limit=80')
              p.write_text(data, encoding='utf-8')

          # Seven real phases in final summaries and project delivery history.
          path = Path('app/static/game/final-delivery-summary.js')
          text = path.read_text(encoding='utf-8')
          text = text.replace('for (let phase = 1; phase <= 6; phase += 1)', 'for (let phase = 1; phase <= 7; phase += 1)', 1)
          text = text.replace("const isVerifier = task => String(task?.prompt || '').includes(VERIFIER_MARKER);", "const isVerifier = task => String(task?.prompt || '').includes(VERIFIER_MARKER) || String(task?.title || '').startsWith('[Jogo] Gate');", 1)
          path.write_text(text, encoding='utf-8')

          path = Path('app/static/product-delivery-ui.js')
          text = path.read_text(encoding='utf-8').replace('Array.from({length:6}', 'Array.from({length:7}', 1)
          path.write_text(text, encoding='utf-8')

          # Architecture-aware final delivery: URL is mandatory only for explicit web projects.
          path = Path('app/static/build-game-url-bonus.js')
          text = path.read_text(encoding='utf-8')
          old = """  const projectId = () => String(localStorage.getItem(PROJECT_KEY) || '').trim();\n  const normalizedStatus = delivery => String(delivery?.status || 'pending').toLowerCase();\n  const missionDelivered = delivery => normalizedStatus(delivery) === 'ready' && Boolean(safeUrl(delivery?.url));\n  const autoKey = id => `${AUTO_KEY}:${id}`;\n"""
          new = """  const projectId = () => String(localStorage.getItem(PROJECT_KEY) || '').trim();\n  const currentProject = () => {\n    const rows = typeof state !== 'undefined' && Array.isArray(state.projects) ? state.projects : [];\n    return rows.find(project => String(project?.id) === projectId()) || null;\n  };\n  const deliveryMode = () => String(currentProject()?.delivery_mode || 'code').trim().toLowerCase();\n  const requiresPublicUrl = () => deliveryMode() === 'web';\n  const normalizedStatus = delivery => String(delivery?.status || 'pending').toLowerCase();\n  const missionDelivered = delivery => !requiresPublicUrl() || (normalizedStatus(delivery) === 'ready' && Boolean(safeUrl(delivery?.url)));\n  const autoKey = id => `${AUTO_KEY}:${id}`;\n"""
          if old not in text:
              raise SystemExit('bonus identity block missing')
          text = text.replace(old, new, 1)

          old = """    if (delivered) {\n      panel.dataset.gameMissionDelivered = '1';\n      if (eyebrow) eyebrow.textContent = 'MISSÃO CONCLUÍDA';\n      if (heading) heading.textContent = '🏆 Sistema entregue e URL validada';\n      if (summary) summary.textContent = `${originalSummary}${originalSummary ? ' ' : ''}URL pública validada e pronta para teste.`;\n      return;\n    }\n"""
          new = """    if (delivered) {\n      panel.dataset.gameMissionDelivered = '1';\n      if (eyebrow) eyebrow.textContent = 'MISSÃO CONCLUÍDA';\n      if (requiresPublicUrl()) {\n        if (heading) heading.textContent = '🏆 Sistema entregue e URL validada';\n        if (summary) summary.textContent = `${originalSummary}${originalSummary ? ' ' : ''}URL pública validada e pronta para teste.`;\n      } else {\n        if (heading) heading.textContent = '🏆 Entrega técnica concluída';\n        if (summary) summary.textContent = `${originalSummary}${originalSummary ? ' ' : ''}Código, testes e evidências da rodada foram concluídos. Publicação externa é opcional para este tipo de projeto.`;\n      }\n      return;\n    }\n"""
          if old not in text:
              raise SystemExit('bonus delivered block missing')
          text = text.replace(old, new, 1)

          old = """    if (missionDelivered(delivery)) {\n      localStorage.removeItem(autoKey(projectId()));\n      host.innerHTML = `\n        <span class=\"eyebrow\">🎁 ENTREGA FINAL CONCLUÍDA</span>\n        <div class=\"build-game-url-bonus-head\">\n          <strong>URL de teste liberada</strong>\n          <span class=\"build-game-url-bonus-state\">PRONTO PARA TESTAR</span>\n        </div>\n        <p>A missão foi concluída porque o ambiente publicado respondeu ao teste real de disponibilidade.</p>\n        <a class=\"build-game-url-value\" href=\"${escapeHtml(url)}\" target=\"_blank\" rel=\"noopener noreferrer\">${escapeHtml(url)}</a>\n        <div class=\"build-game-url-actions\"><a class=\"primary\" href=\"${escapeHtml(url)}\" target=\"_blank\" rel=\"noopener noreferrer\">Abrir sistema ↗</a></div>\n      `;\n      return;\n    }\n"""
          new = """    if (missionDelivered(delivery)) {\n      localStorage.removeItem(autoKey(projectId()));\n      if (requiresPublicUrl()) {\n        host.innerHTML = `\n          <span class=\"eyebrow\">🎁 ENTREGA FINAL CONCLUÍDA</span>\n          <div class=\"build-game-url-bonus-head\">\n            <strong>URL de teste liberada</strong>\n            <span class=\"build-game-url-bonus-state\">PRONTO PARA TESTAR</span>\n          </div>\n          <p>A missão foi concluída porque o ambiente publicado respondeu ao teste real de disponibilidade.</p>\n          <a class=\"build-game-url-value\" href=\"${escapeHtml(url)}\" target=\"_blank\" rel=\"noopener noreferrer\">${escapeHtml(url)}</a>\n          <div class=\"build-game-url-actions\"><a class=\"primary\" href=\"${escapeHtml(url)}\" target=\"_blank\" rel=\"noopener noreferrer\">Abrir sistema ↗</a></div>\n        `;\n      } else {\n        host.innerHTML = `\n          <span class=\"eyebrow\">🎁 ENTREGA DE DESENVOLVIMENTO CONCLUÍDA</span>\n          <div class=\"build-game-url-bonus-head\">\n            <strong>Rodada pronta para continuar o projeto</strong>\n            <span class=\"build-game-url-bonus-state\">CÓDIGO VALIDADO</span>\n          </div>\n          <p>As sete etapas foram aprovadas. Este projeto não exige URL pública para concluir a rodada.</p>\n          ${url ? `<a class=\"build-game-url-value\" href=\"${escapeHtml(url)}\" target=\"_blank\" rel=\"noopener noreferrer\">${escapeHtml(url)}</a>` : ''}\n        `;\n      }\n      return;\n    }\n"""
          if old not in text:
              raise SystemExit('bonus render block missing')
          text = text.replace(old, new, 1)
          text = text.replace("  const automaticDelivery = async (panel, id, delivery) => {\n    let current = delivery || {};", "  const automaticDelivery = async (panel, id, delivery) => {\n    let current = delivery || {};\n    if (!requiresPublicUrl()) return current;", 1)
          text = text.replace("    host.innerHTML = '<span class=\"eyebrow\">🚀 ENTREGA FINAL</span><strong>Publicando e validando URL real…</strong>';", "    host.innerHTML = requiresPublicUrl()\n      ? '<span class=\"eyebrow\">🚀 ENTREGA FINAL</span><strong>Publicando e validando URL real…</strong>'\n      : '<span class=\"eyebrow\">📦 ENTREGA FINAL</span><strong>Consolidando entrega técnica…</strong>';", 1)
          path.write_text(text, encoding='utf-8')

          # Bootstrap identity + continuity asset and cache revision.
          path = Path('app/static/game/game-bootstrap.js')
          text = path.read_text(encoding='utf-8')
          text = text.replace("const ASSET_REVISION = 'game-flow-v77-20260902';", "const ASSET_REVISION = 'game-development-v80-20260902';", 1)
          text = text.replace("    'game/objective-controls.js',\n    'game/delivery-gate.js',", "    'game/objective-controls.js',\n    'game/development-continuity.js',\n    'game/delivery-gate.js',", 1)
          identity_old = """      if (typeof window.api !== 'function' || !window.__devpilotGameApiReady) throw new Error('Runtime de comunicação indisponível');\n      if (typeof window.loadBuildGame !== 'function' || !window.__devpilotGameControllerV73) throw new Error('Motor do jogo indisponível');\n\n      window.__devpilotGameLoadError = null;\n"""
          identity_new = """      if (typeof window.api !== 'function' || !window.__devpilotGameApiReady) throw new Error('Runtime de comunicação indisponível');\n      if (typeof window.loadBuildGame !== 'function' || !window.__devpilotGameControllerV73) throw new Error('Motor do jogo indisponível');\n\n      if (window.__devpilotGameState && !window.__devpilotGameState.currentUser) {\n        window.__devpilotGameState.currentUser = await withTimeout(window.api('/auth/me'), 'Identificação do jogador', 6000);\n      }\n      window.__devpilotGameLoadError = null;\n"""
          if identity_old not in text:
              raise SystemExit('bootstrap identity block missing')
          text = text.replace(identity_old, identity_new, 1)
          path.write_text(text, encoding='utf-8')

          # Standalone revision must invalidate the three core assets.
          path = Path('app/static/game/index.html')
          text = path.read_text(encoding='utf-8').replace('game-flow-v77-20260902', 'game-development-v80-20260902').replace('data-game-critical-boot-v77', 'data-game-critical-boot-v80').replace('data-devpilot-game-version="v77"', 'data-devpilot-game-version="v80"')
          path.write_text(text, encoding='utf-8')

          # Existing runtime contract follows the new bounded payload sizes.
          path = Path('tests/test_game_ships_stable_runtime_contract.py')
          text = path.read_text(encoding='utf-8').replace('/ui/projects?limit=50', '/ui/projects?limit=100').replace('assert "limit=24" in GAME_RUNTIME', 'assert "limit=80" in GAME_RUNTIME')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Add v80 regression contracts
        run: |
          cat > tests/test_game_development_continuity_v80.py <<'PY'
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          CONTINUITY = (ROOT / 'app/static/game/development-continuity.js').read_text(encoding='utf-8')
          BOOT = (ROOT / 'app/static/game/game-bootstrap.js').read_text(encoding='utf-8')
          RUNTIME = (ROOT / 'app/static/game/runtime.js').read_text(encoding='utf-8')
          ROUTES = (ROOT / 'app/frontend_ui_routes.py').read_text(encoding='utf-8')
          SUMMARY = (ROOT / 'app/static/game/final-delivery-summary.js').read_text(encoding='utf-8')
          BONUS = (ROOT / 'app/static/build-game-url-bonus.js').read_text(encoding='utf-8')
          DELIVERY_UI = (ROOT / 'app/static/product-delivery-ui.js').read_text(encoding='utf-8')


def test_game_can_switch_projects_and_resume_existing_work():
    assert 'switchProject(projectId)' in CONTINUITY
    assert "localStorage.removeItem(MISSION_KEY)" in CONTINUITY
    assert "repairStaleMission(state)" in CONTINUITY
    assert "devpilot:game:projects-ready" in CONTINUITY
    assert "data-game80-project-switch" in CONTINUITY


def test_game_loads_all_projects_in_bounded_pages():
    assert 'offset: int = Query(0' in ROUTES
    assert '.offset(offset)' in ROUTES
    assert 'PAGE_SIZE = 100' in CONTINUITY
    assert 'MAX_PROJECTS = 1000' in CONTINUITY
    assert '/ui/projects?limit=${PAGE_SIZE}&offset=${offset}' in CONTINUITY


def test_game_recovers_failed_or_blocked_execution_before_asking_user():
    assert '/recovery/escalate' in CONTINUITY
    assert '/recovery/resume' in CONTINUITY
    assert '/recovery/intervene' in CONTINUITY
    assert "['failed', 'blocked', 'cancelled', 'canceled']" in CONTINUITY
    assert 'manual_intervention_required' in CONTINUITY
    assert 'Orientar agente e continuar' in CONTINUITY


def test_compact_runtime_keeps_enough_history_after_retries():
    assert '/ui/projects?limit=100' in RUNTIME
    assert 'limit=80' in RUNTIME
    assert 'limit: int = Query(80, ge=1, le=100)' in ROUTES


def test_delivery_is_compatible_with_web_service_cli_and_automation_projects():
    assert '_project_delivery_mode' in ROUTES
    assert 'return "web"' in ROUTES
    assert 'return "service"' in ROUTES
    assert 'return "code"' in ROUTES
    assert 'requiresPublicUrl' in BONUS
    assert "deliveryMode() === 'web'" in BONUS
    assert 'Este projeto não exige URL pública para concluir a rodada.' in BONUS


def test_all_seven_phases_are_reported():
    assert 'phase <= 7' in SUMMARY
    assert "startsWith('[Jogo] Gate')" in SUMMARY
    assert 'Array.from({length:7}' in DELIVERY_UI


def test_v80_is_loaded_after_simple_ui_and_knows_current_user():
    assert "'game/development-continuity.js'" in BOOT
    assert BOOT.index("'game/objective-controls.js'") < BOOT.index("'game/development-continuity.js'")
    assert "window.api('/auth/me')" in BOOT
    assert "game-development-v80-20260902" in BOOT
          PY

      - name: Validate syntax and focused contracts
        run: |
          node --check app/static/game/development-continuity.js
          node --check app/static/game/runtime.js
          node --check app/static/game/game-bootstrap.js
          node --check app/static/game/task-payload-guard.js
          node --check app/static/game/delivery-gate.js
          node --check app/static/game/final-delivery-summary.js
          node --check app/static/build-game-url-bonus.js
          python -m pip install -e '.[test]'
          python -m pytest -q tests/test_game_development_continuity_v80.py tests/test_game_ships_stable_runtime_contract.py tests/test_isolated_game_runtime.py

      - name: Commit generated integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app tests
          if git diff --cached --quiet; then
            echo 'GAME_V80_PATCH=ALREADY_APPLIED'
            exit 0
          fi
          git commit -m 'feat(game): integrar continuidade de desenvolvimento v80'
          git push origin HEAD:feat/game-development-continuity-v80
