name: Nonblocking recovery focused

on:
  push:
    branches:
      - fix/nonblocking-ai-recovery-pipeline-20260914

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Compile changed Python modules
        run: python -m py_compile app/services/recovery.py app/services/failure_recovery.py app/worker.py
      - name: Run focused recovery tests
        run: python -m pytest -q tests/test_recovery.py tests/test_failure_recovery_flow_contract.py tests/test_nonblocking_recovery_worker_contract.py
