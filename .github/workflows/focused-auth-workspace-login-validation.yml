name: Focused auth workspace login validation

on:
  push:
    branches:
      - security/auth-workspace-login-isolation

permissions:
  contents: read

concurrency:
  group: focused-auth-workspace-login-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auth:
    name: Auth workspace isolation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Validate JSON quality manifest
        run: python -m json.tool .devpilot/quality-modules.json >/dev/null
      - name: Compile changed auth files
        run: python -m compileall -q app/auth_routes.py tests/test_auth_workspace_login_isolation.py
      - name: Run focused auth tests
        run: >-
          python -m pytest -q --tb=short
          tests/test_auth_workspace_login_isolation.py
          tests/test_auth.py
          tests/test_account_isolation.py
