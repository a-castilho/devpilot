name: Apply game development tool v81

on:
  push:
    branches:
      - fix/game-development-tool-v81

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/game-development-tool-v81
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch validated continuity source
        run: git fetch origin feat/game-development-continuity-v80

      - name: Apply clean integration
        run: python scripts/apply_game_v81.py

      - name: Install test dependencies
        run: python -m pip install -e '.[test]'

      - name: Engineering policy
        run: python scripts/check-engineering-standards.py --changed

      - name: Critical quality matrix contract
        run: python scripts/critical-quality-matrix.py

      - name: Python compile
        run: python -m compileall -q app

      - name: JavaScript syntax
        run: |
          node --check app/static/build-game.js
          node --check app/static/build-game-url-bonus.js
          node --check app/static/game/runtime.js
          node --check app/static/game/game-bootstrap.js
          node --check app/static/game/task-payload-guard.js
          node --check app/static/game/delivery-gate.js
          node --check app/static/game/development-continuity.js
          node --check app/static/game/final-delivery-summary.js

      - name: Focused game contracts
        run: |
          python -m pytest -q \
            tests/test_game_development_tool_v81.py \
            tests/test_game_development_continuity_v80.py \
            tests/test_game_ships_stable_runtime_contract.py \
            tests/test_game_delivery_gate.py \
            tests/test_failure_recovery_flow_contract.py

      - name: Commit integrated implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app docs tests
          if git diff --cached --quiet; then
            echo 'GAME_V81_ALREADY_APPLIED=1'
            exit 0
          fi
          git commit -m 'fix(game): alinhar ferramenta de desenvolvimento v81'
          git push origin HEAD:fix/game-development-tool-v81
