name: Focused local validation

on:
  push:
    branches:
      - test/integration-worker-git-local-validation

permissions:
  contents: read

concurrency:
  group: focused-local-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker-git:
    name: Worker and Git focused local tests
    runs-on: ${{ vars.DEVPILOT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused test dependencies
        run: python -m pip install -e '.[test]'

      - name: Run worker lease and Git boundary tests
        run: >-
          python -m pytest -q
          tests/test_worker_lease_fencing.py
          tests/test_git_credential_boundary.py
