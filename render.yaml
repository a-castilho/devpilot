services:
  - type: web
    name: devpilot-homolog
    runtime: docker
    plan: free
    repo: https://github.com/a-castilho/devpilot
    branch: homolog/snapshot-20260909
    renderSubdomainPolicy: enabled
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    autoDeployTrigger: checksPass
    healthCheckPath: /health
    envVars:
      - key: DEVPILOT_ENV
        value: homologation
      - key: DEVPILOT_DATABASE_URL
        sync: false
      - key: DEVPILOT_DATA_DIR
        value: /tmp/devpilot
      - key: DEVPILOT_REPOSITORIES_DIR
        value: /tmp/devpilot/repositories
      - key: DEVPILOT_HOST_ACTIONS_DIR
        value: /tmp/devpilot/host-actions
      - key: DEVPILOT_BOOTSTRAP_TOKEN
        generateValue: true
      - key: DEVPILOT_AUTH_SECRET
        generateValue: true
      - key: DEVPILOT_AUTH_TOKEN_TTL_SECONDS
        value: "3600"
      - key: DEVPILOT_ENCRYPTION_KEY
        generateValue: true
      - key: DEVPILOT_EXECUTION_ENABLED
        value: "false"
      - key: DEVPILOT_EMBEDDED_WORKER
        value: "true"
      - key: DEVPILOT_ALLOWED_GIT_HOSTS
        value: github.com
      - key: DEVPILOT_OPENAI_API_KEY
        sync: false
